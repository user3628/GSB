[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-audit"
version = "0.1.0"
description = "Deterministic local quantization error propagation audit and calibration rollback engine"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
quant-audit = "quant_audit.cli:main"

[tool.setuptools.packages.find]
include = ["quant_audit*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

