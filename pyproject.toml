[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-kv-index"
version = "1.0.0"
description = "Segment-backed local key/value index with expiry, import arbitration and crash recovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "requests>=2.31"]

[project.scripts]
kvstore-server = "kvstore.__main__:main"

[tool.setuptools.packages.find]
include = ["kvstore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

