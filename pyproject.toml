[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-config-hot-reload"
version = "0.1.0"
description = "SQLite-backed hot configuration middleware for local deterministic services"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["confighub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

