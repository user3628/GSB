[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gradsync"
version = "0.1.0"
description = "Deterministic local gradient exchange and AllReduce scheduler"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
gradsync = "gradsync.cli:main"

[tool.setuptools.packages.find]
include = ["gradsync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

