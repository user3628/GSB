[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matgen-local"
version = "1.0.0"
description = "Deterministic local texture and material generation with error budgets"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==1.26.4",
  "Pillow==10.4.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.3"]

[project.scripts]
matgen = "matgen.cli:main"

[tool.setuptools.packages.find]
include = ["matgen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

