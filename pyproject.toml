[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cabin-voice-arbiter"
version = "0.1.0"
description = "Deterministic in-cabin multi-zone VAD and command attribution workbench"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
cabin-voice = "cabin_voice.cli:main"

[tool.setuptools.packages.find]
include = ["cabin_voice*"]

[tool.setuptools.package-data]
cabin_voice = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
