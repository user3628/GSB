[project]
name = "serverless-coldstart-lab"
version = "0.1.0"
description = "Deterministic local Serverless cold-start and concurrency verifier"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=1.26",
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

