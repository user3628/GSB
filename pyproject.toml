[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmir-alignment"
version = "0.1.0"
description = "Deterministic, explainable cross-modal alignment and retrieval reference component"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "Pillow>=9.4,<14",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
cmir = "cmir_alignment.cli:main"

[tool.setuptools.packages.find]
include = ["cmir_alignment*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
