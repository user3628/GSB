[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panopipe"
version = "1.0.0"
description = "Deterministic local panoptic mask processing and verification pipeline"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
panopipe = "panopipe.cli:main"

[tool.setuptools.packages.find]
include = ["panopipe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
