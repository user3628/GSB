[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "loopback-tunnel-gateway"
version = "1.0.0"
description = "Loopback VPN tunnel gateway with atomic route rebuilds and crash recovery"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
vgw = "vgw.cli:main"

[tool.setuptools.packages.find]
include = ["vgw*"]

[tool.setuptools.package-data]
vgw = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

