[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "headworkbench"
version = "1.0.0"
description = "Deterministic attention-head truncation adjudication and version workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "PyYAML>=6.0",
]

[project.scripts]
headworkbench = "headworkbench.cli:main"

[tool.setuptools.packages.find]
include = ["headworkbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

