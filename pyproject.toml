[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-gpu-quota-scheduler"
version = "1.0.0"
description = "Deterministic local GPU quota admission, inference batching and execution-budget adjudication engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Flask>=3.0", "NumPy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
quota-scheduler = "quota_scheduler.cli:main"

[tool.setuptools.packages.find]
include = ["quota_scheduler*"]

[tool.setuptools.package-data]
quota_scheduler = ["schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

