[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dimcluster-workbench"
version = "1.0.0"
description = "Deterministic local tabular dimensionality-reduction and clustering diagnostics workbench"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.3.5",
  "scikit-learn==1.9.1",
]

[project.scripts]
dimcluster = "dimcluster.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
