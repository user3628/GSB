[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kde-drift-workbench"
version = "1.0.0"
description = "Deterministic local KDE drift and distribution comparison workbench"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4"]

[tool.setuptools.packages.find]
include = ["kde_drift*"]

[tool.setuptools.package-data]
kde_drift = ["static/*"]
