[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-bench"
version = "1.0.0"
description = "Deterministic local LoRA parallel scheduling workbench"
requires-python = ">=3.11"
dependencies = [
    "torch==2.2.2",
    "numpy==1.26.4",
    "fastapi==0.110.0",
    "uvicorn==0.29.0",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
test = ["pytest==8.1.1", "httpx==0.27.0"]

[project.scripts]
lora-bench = "lora_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
