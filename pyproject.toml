[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-text-pipeline"
version = "0.1.0"
description = "Deterministic batch text classification and verification pipeline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
batch-text-pipeline = "pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["pipeline*"]
