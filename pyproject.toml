[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-eval-engine"
version = "0.1.0"
description = "Local deterministic multi-model evaluation, invalidation, and selection engine"
requires-python = ">=3.11"
dependencies = ["numpy==2.5.5"]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[project.scripts]
eval-engine = "eval_engine.cli:main"

[tool.setuptools.packages.find]
include = ["eval_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
