[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leasecoord"
version = "0.1.0"
description = "Local multi-process lease election and failover coordinator"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
leasecoord-server = "leasecoord.server:main"

[tool.setuptools.packages.find]
include = ["leasecoord*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
