[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capacity-lab"
version = "1.0.0"
description = "Deterministic local capacity evaluation and fixed-point verdict application"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
capacity-lab = "capacity_lab.cli:main"

[tool.setuptools]
packages = ["capacity_lab"]

