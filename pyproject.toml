[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "gridpipe"
version = "1.0.0"
description = "Deterministic local table and chart structure pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
]

[project.scripts]
gridpipe = "gridpipe.cli:main"

[tool.setuptools.packages.find]
include = ["gridpipe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

