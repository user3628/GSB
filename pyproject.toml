[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctr-cvr-workbench"
version = "1.0.0"
description = "Deterministic local CTR/CVR training and experiment workbench"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6.0"]

[tool.setuptools]
packages = ["ctr_cvr_workbench"]

[project.scripts]
ctr-cvr = "ctr_cvr_workbench.cli:main"
