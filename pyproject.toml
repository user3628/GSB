[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qos-workbench"
version = "1.0.0"
description = "Local QoS traffic-shaping policy workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "numpy>=2.2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "httpx>=0.28,<1"]

[project.scripts]
qos-workbench = "qos_workbench.__main__:main"

[tool.setuptools.packages.find]
include = ["qos_workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

