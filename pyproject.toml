[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashblock-attention"
version = "0.1.0"
description = "NumPy FlashAttention-style blockwise attention with incremental checkpoints"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]
license = {text = "Proprietary"}

[project.scripts]
flashblock = "flashblock.cli:main"

[tool.setuptools.packages.find]
include = ["flashblock*", "scripts*"]

