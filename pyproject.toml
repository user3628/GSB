[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-cite"
version = "2.0.0"
description = "Cross-language legal citation locator normalization and conflict resolution"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.1.3",
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.4", "httpx==0.28.1"]

[project.scripts]
legal-cite = "legal_cite.cli:main"

[tool.setuptools]
packages = ["legal_cite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
