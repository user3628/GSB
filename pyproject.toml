[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmcoop"
version = "0.1.0"
description = "Deterministic local multimodal cooperative reasoning editor"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "numpy>=2.0",
  "pillow>=10.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
mmcoop = "mmcoop.cli:main"

[tool.setuptools]
packages = ["mmcoop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

