[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rope-diagnostics"
version = "1.0.0"
description = "Deterministic local RoPE operator and interactive diagnostics app"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "fastapi>=0.100", "uvicorn>=0.23", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7.0", "httpx>=0.27"]

[project.scripts]
rope-diag = "rope_diag.cli:main"

[tool.setuptools.packages.find]
include = ["rope_diag*"]

[tool.setuptools.package-data]
rope_diag = ["static/*.html"]
