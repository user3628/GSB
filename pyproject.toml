[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detdiff-workbench"
version = "0.1.0"
description = "Deterministic local text-to-image diffusion pipeline workbench"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pillow>=10.0",
  "pyyaml>=6.0",
]

[project.scripts]
detdiff = "detdiff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

