[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-tcp-congestion-workbench"
version = "1.0.0"
description = "Deterministic local TCP connection and congestion-control adjudication workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["tcp_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
