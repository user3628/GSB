[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-motion-engine"
version = "1.0.0"
description = "Deterministic local video prediction and motion-state evolution engine"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
motion-engine = "motion_engine.cli:main"

[tool.setuptools.packages.find]
include = ["motion_engine*"]
