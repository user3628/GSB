[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instruction-quality-workbench"
version = "1.0.0"
description = "Deterministic local workbench for instruction-tuning data quality and diagnostics"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
qwb = "qworkbench.cli:main"

[tool.setuptools.packages.find]
include = ["qworkbench*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
