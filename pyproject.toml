[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "posalign"
version = "1.0.0"
description = "Deterministic POS tagset migration and cross-version alignment engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0; python_version >= '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
posalign = "posalign.cli:main"

[tool.setuptools.packages.find]
include = ["posalign*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

