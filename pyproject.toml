[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leasefair"
version = "0.1.0"
description = "Deterministic local multiprocess lease-lock middleware"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.4",
  "numpy==2.4.6",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["leasefair*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

