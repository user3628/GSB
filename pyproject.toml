[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiofp-audit"
version = "1.0.0"
description = "Deterministic audio-fingerprint compression and quantization-error audit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
audiofp = "audiofp.cli:main"

[tool.setuptools.packages.find]
include = ["audiofp*"]

