[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-anomaly-workbench"
version = "1.0.0"
description = "Local deterministic anomaly detection, checkpointing and incremental diagnostics"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3"]

[project.scripts]
anomaly-workbench = "anomaly_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["anomaly_workbench*"]
