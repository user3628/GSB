[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halu-pipeline"
version = "0.1.0"
description = "Deterministic local LLM evaluation and hallucination detection pipeline"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "jsonlines>=4.0",
]

[project.scripts]
halu-pipeline = "halu_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
