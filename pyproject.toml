[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-pose-pipeline"
version = "1.0.0"
description = "Deterministic, incremental keypoint and pose validation pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.5",
]

[project.scripts]
pose-pipeline = "pose_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["pose_pipeline*", "scripts*"]
