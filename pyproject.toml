[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmpipe"
version = "1.0.0"
description = "Local deterministic multimodal collaborative-inference pipeline with checkpointing and verification"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.1.3",
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
]

[project.scripts]
mmpipe = "mmpipe.cli:main"
mmpipe-verify = "mmpipe.verify_cli:main"
mmpipe-serve = "mmpipe.api:main"

[tool.setuptools.packages.find]
where = ["src"]
