[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-stream-tts"
version = "0.1.0"
description = "Deterministic local streaming TTS inference engine for reproducible experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pyyaml>=6.0",
  "pytest>=8.0",
]

[project.optional-dependencies]
test = ["httpx>=0.27"]

[project.scripts]
stream-tts = "stream_tts.cli:main"

[tool.setuptools.packages.find]
include = ["stream_tts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
