[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rateguard"
version = "1.0.0"
description = "Deterministic adaptive rate limiting and circuit breaking for local microservice tests"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["rateguard*"]

