[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vadkit"
version = "0.1.0"
description = "Deterministic streaming voice activity detection component"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.4.6",
  "scipy==1.17.1",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[project.scripts]
vadkit = "vadkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

