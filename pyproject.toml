[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audioq-workbench"
version = "1.0.0"
description = "Local deterministic audio quality assessment workbench"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "flask>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
audioq = "audioq.cli:main"

[tool.setuptools.packages.find]
include = ["audioq*"]

[tool.setuptools.package-data]
audioq = ["templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
