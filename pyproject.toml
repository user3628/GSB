[project]
name = "xfpipe"
version = "1.0.0"
description = "Deterministic tabular feature-crossing and dimensionality-reduction pipeline"
requires-python = ">=3.11"
dependencies = ["numpy", "fastapi", "uvicorn"]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
