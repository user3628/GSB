[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-service-registry"
version = "1.0.0"
description = "Local microservice registry with versioned snapshot formats and health probes"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "requests==2.32.3",
]

[project.optional-dependencies]
test = ["pytest==8.3.4", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["svc_registry*"]
