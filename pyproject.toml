[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xrel-workbench"
version = "1.0.0"
description = "Cross-lingual relevance scoring and numeric error propagation workbench"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "PyYAML>=6.0,<7", "Flask>=3.0,<4"]

[project.scripts]
xrel-workbench = "xrel_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["xrel_workbench*", "scripts*"]

[tool.setuptools.package-data]
xrel_workbench = ["webui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
