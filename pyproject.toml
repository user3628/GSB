[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s-local-scheduling-simulator"
version = "1.0.0"
description = "Offline deterministic Kubernetes scheduling budget and affinity simulator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["schedsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

