[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gateway-auth-rate-middleware"
version = "1.0.0"
description = "Local deterministic authorization and multi-window rate-limit middleware"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
gateway-middleware = "gateway_middleware.__main__:main"

[tool.setuptools.packages.find]
include = ["gateway_middleware*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
