[project]
name = "config-coordinator"
version = "1.0.0"
description = "Multi-cluster configuration distribution coordinator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

