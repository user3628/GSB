[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "replication-lag-governance"
version = "1.0.0"
description = "Local deterministic replication lag policy editor and adjudication service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "numpy>=1.26,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
replication-guard = "replication_guard.__main__:main"

[tool.setuptools.packages.find]
include = ["replication_guard*"]

