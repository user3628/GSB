[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-tiering-migration"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.5",
  "uvicorn>=0.27",
  "numpy>=1.24",
]

[tool.setuptools.packages.find]
include = ["app*"]
