[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mv-workbench"
version = "0.1.0"
description = "Deterministic incremental materialized-view and dependency diagnostics workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "numpy>=2.0,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["mv_workbench*"]

[tool.setuptools.package-data]
mv_workbench = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
