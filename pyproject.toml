[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "joincost-lab"
version = "1.0.0"
description = "Deterministic left-deep join ordering, cost decomposition, and diagnostics workbench"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
joincost = "joincost.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

