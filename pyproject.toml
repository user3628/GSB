[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embedding-gather"
version = "0.1.0"
description = "Deterministic sharded embedding lookup and gather component with manifest interoperability"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
embedding-gather = "embedding_gather.cli:main"

[tool.setuptools.packages.find]
include = ["embedding_gather*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
