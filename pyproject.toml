[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shardroute-local"
version = "0.1.0"
description = "Deterministic local multi-database sharding router with crash recovery"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["shardroute*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

