<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Image Workbench · 确定性图像修复与格式互操作</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08111f;
      --panel: rgba(15, 29, 48, 0.9);
      --panel-2: rgba(21, 40, 64, 0.88);
      --line: rgba(125, 178, 220, 0.18);
      --text: #e5f1ff;
      --muted: #8fa8c1;
      --accent: #4fd1c5;
      --accent-2: #67a7ff;
      --warn: #ffc66d;
      --error: #ff7e91;
      --ok: #7ee2a8;
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 5%, rgba(79, 209, 197, 0.16), transparent 30rem),
        radial-gradient(circle at 90% 12%, rgba(103, 167, 255, 0.18), transparent 34rem),
        linear-gradient(160deg, #07101c 0%, #0b1727 48%, #07111e 100%);
      min-height: 100vh;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: linear-gradient(to bottom, black, transparent 72%);
    }
    main { width: min(1320px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 80px; position: relative; }
    .hero { display: flex; gap: 24px; justify-content: space-between; align-items: flex-start; margin-bottom: 22px; }
    .eyebrow { color: var(--accent); letter-spacing: .18em; font-size: 12px; font-weight: 800; text-transform: uppercase; }
    h1 { font-size: clamp(28px, 4vw, 52px); line-height: 1.03; letter-spacing: -.04em; margin: 8px 0 12px; max-width: 820px; }
    .sub { color: var(--muted); max-width: 780px; line-height: 1.65; margin: 0; }
    .version { border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; color: var(--muted); font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; white-space: nowrap; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0; }
    button {
      border: 1px solid var(--line);
      background: rgba(28, 54, 84, .75);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }
    button:hover { transform: translateY(-1px); border-color: rgba(103, 167, 255, .6); background: rgba(35, 66, 102, .9); }
    button.primary { background: linear-gradient(135deg, #2eb9ae, #387fd4); border-color: transparent; color: #04101b; }
    button.danger { color: #ffd4da; border-color: rgba(255, 126, 145, .4); }
    button:disabled { opacity: .45; cursor: wait; transform: none; }
    .dashboard { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
    .metric, panel { }
    .metric {
      border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); padding: 16px;
      backdrop-filter: blur(16px);
    }
    .metric .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; }
    .metric .value { font: 700 22px ui-monospace, SFMono-Regular, Consolas, monospace; margin-top: 8px; overflow-wrap: anywhere; }
    .panel { border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); padding: 18px; backdrop-filter: blur(16px); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
    h2 { margin: 0; font-size: 18px; letter-spacing: -.02em; }
    .muted { color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { border: 1px solid var(--line); border-radius: 999px; padding: 5px 9px; font: 11px ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--muted); }
    .chip.ok { color: var(--ok); border-color: rgba(126, 226, 168, .35); }
    .chip.warn { color: var(--warn); border-color: rgba(255, 198, 109, .35); }
    #error-panel { display: none; margin: 14px 0; border-color: rgba(255, 126, 145, .5); background: rgba(74, 18, 33, .72); }
    #error-panel pre { white-space: pre-wrap; margin: 8px 0 0; color: #ffc5ce; font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; }
    #fragments { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }
    .fragment { border: 1px solid var(--line); background: var(--panel-2); border-radius: var(--radius); padding: 17px; }
    .fragment-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .fragment h3 { margin: 0; font-size: 16px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .fragment-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 14px 0; }
    .field label { display: block; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 5px; }
    input, select {
      width: 100%; border: 1px solid var(--line); background: rgba(6, 16, 29, .82); color: var(--text);
      border-radius: 9px; padding: 9px 10px; font: 13px ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    .stage-list { display: grid; gap: 6px; margin: 12px 0; }
    .stage { display: grid; grid-template-columns: 72px 64px 1fr; gap: 8px; align-items: center; font: 11px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .stage .name { color: var(--muted); }
    .stage .fp { color: #8ab9e9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stage .state { border-radius: 6px; padding: 3px 6px; text-align: center; }
    .state.reused { color: var(--ok); background: rgba(126, 226, 168, .1); }
    .state.invalidated { color: var(--warn); background: rgba(255, 198, 109, .1); }
    .state.rebuilt { color: var(--accent-2); background: rgba(103, 167, 255, .1); }
    .reason { color: var(--muted); font-size: 12px; line-height: 1.5; min-height: 18px; }
    .fragment-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
    .fragment-actions button { padding: 7px 10px; font-size: 12px; }
    .empty { padding: 34px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }
    .output { margin-top: 14px; border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: rgba(6, 16, 29, .5); font: 11px ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap; max-height: 260px; overflow: auto; }
    @media (max-width: 900px) { .dashboard { grid-template-columns: repeat(2, 1fr); } #fragments { grid-template-columns: 1fr; } .hero { flex-direction: column; } }
  </style>
</head>
<body>
<main>
  <section class="hero">
    <div>
      <div class="eyebrow">Deterministic local pipeline</div>
      <h1>图像修复与风格迁移<br />格式互操作工作台</h1>
      <p class="sub">确定性邻域扩散修复 · 参考图颜色统计迁移 · PNG/JPEG/JSON 双向编解码 · 显式格式降级 · 阶段指纹与快照并发保护。无 GPU、无外部模型、无网络依赖。</p>
    </div>
    <div class="version" id="health">LOCAL · API</div>
  </section>

  <div class="toolbar">
    <button class="primary" onclick="bootstrap(true)">载入样本并运行</button>
    <button onclick="runPipeline(false)">增量运行</button>
    <button onclick="runPipeline(true)">强制重建</button>
    <button class="danger" onclick="control('stop')">请求停止</button>
    <button onclick="control('resume')">恢复运行</button>
    <button onclick="exportProject()">导出内部工程</button>
    <button onclick="refresh()">刷新状态</button>
  </div>

  <section class="dashboard" id="metrics"></section>
  <section class="panel" id="error-panel"><strong>错误</strong><pre id="error-text"></pre></section>
  <section id="fragments"></section>
  <section class="panel" style="margin-top:14px">
    <div class="panel-head"><h2>最近操作</h2><span class="muted">JSON</span></div>
    <div class="output" id="output">等待操作…</div>
  </section>
</main>
<script>
async function api(path, options = {}) {
  const response = await fetch(path, {headers: {'Content-Type': 'application/json', ...(options.headers || {})}, ...options});
  const body = await response.json().catch(() => ({ok: false, error: {code: 'E_HTTP', message: response.statusText}}));
  if (!response.ok || body.ok === false) {
    showError(body.error || {code: 'E_HTTP', message: response.statusText});
    throw new Error((body.error && body.error.message) || response.statusText);
  }
  clearError();
  return body;
}
function setBusy(flag) { document.querySelectorAll('button').forEach(b => b.disabled = flag); }
function showError(error) {
  const panel = document.getElementById('error-panel');
  panel.style.display = 'block';
  document.getElementById('error-text').textContent = JSON.stringify(error, null, 2);
}
function clearError() { document.getElementById('error-panel').style.display = 'none'; }
function showOutput(value) { document.getElementById('output').textContent = JSON.stringify(value, null, 2); }
async function bootstrap(run) {
  setBusy(true);
  try { showOutput(await api('/api/project/bootstrap-sample?run=' + (run ? 'true' : 'false'), {method: 'POST'})); await refresh(); }
  finally { setBusy(false); }
}
async function runPipeline(force) {
  setBusy(true);
  try { showOutput(await api('/api/run', {method: 'POST', body: JSON.stringify({force})})); await refresh(); }
  finally { setBusy(false); }
}
async function control(action) {
  setBusy(true);
  try { showOutput(await api('/api/control/' + action, {method: 'POST'})); await refresh(); }
  finally { setBusy(false); }
}
async function exportProject() {
  setBusy(true);
  try { showOutput(await api('/api/project/export', {method: 'POST', body: JSON.stringify({path: 'runtime/internal-project.json', artifact: 'style'})})); }
  finally { setBusy(false); }
}
async function updateFragment(id) {
  const card = document.querySelector('[data-fragment="' + CSS.escape(id) + '"]');
  const changes = {
    style_strength: Number(card.querySelector('[name=strength]').value),
    repair_iterations: Number(card.querySelector('[name=iterations]').value),
    output_format: card.querySelector('[name=format]').value
  };
  showOutput(await api('/api/fragments/' + encodeURIComponent(id), {method: 'PATCH', body: JSON.stringify({changes})}));
  await refresh();
}
async function convertFragment(id, target) {
  setBusy(true);
  try { showOutput(await api('/api/convert', {method: 'POST', body: JSON.stringify({fragment_id: id, target_format: target})})); await refresh(); }
  finally { setBusy(false); }
}
function esc(value) { return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function renderStatus(status) {
  const snapshot = status.snapshot || {};
  const control = status.control || {};
  const fragments = status.fragments || {};
  const metrics = [
    ['工程', status.project?.project_name || '未载入'],
    ['分片', String(status.project?.fragment_count ?? 0)],
    ['快照序号', String(snapshot.sequence ?? 0) + ' · ' + (snapshot.status || 'empty')],
    ['停止请求', control.stop_requested ? 'YES' : 'NO']
  ];
  document.getElementById('metrics').innerHTML = metrics.map(([label, value]) => `<div class="metric"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div></div>`).join('');
  const container = document.getElementById('fragments');
  const ids = Object.keys(fragments);
  if (!ids.length) { container.innerHTML = '<div class="empty">尚未载入工程。点击“载入样本并运行”开始。</div>'; return; }
  container.innerHTML = ids.map(id => {
    const f = fragments[id];
    const statuses = f.cached?.statuses || {};
    const preview = f.fingerprints_preview || {};
    const stageRows = ['source','repair','style','export'].map(stage => {
      const state = statuses[stage];
      const fingerprint = preview[stage]?.fingerprint || state?.fingerprint || '—';
      const label = state ? (state.reused ? 'reused' : state.invalidated ? 'invalidated' : 'rebuilt') : 'not-built';
      return `<div class="stage"><span class="name">${stage}</span><span class="state ${esc(label)}">${esc(label)}</span><span class="fp" title="${esc(fingerprint)}">${esc(fingerprint.slice(0, 18))}…</span></div>`;
    }).join('');
    const reason = f.preview_earliest_invalidated_stage ? `${f.preview_earliest_invalidated_stage}: ${f.preview_reason}` : (f.preview_reason || '—');
    return `<article class="fragment" data-fragment="${esc(id)}">
      <div class="fragment-head"><div><h3>${esc(id)}</h3><div class="muted" style="font-size:12px;margin-top:5px">${f.pixels.width}×${f.pixels.height} · mask ${f.mask.pixel_count}px · ref ${esc(f.style_reference)}</div></div><span class="chip">${esc(f.output_format)}</span></div>
      <div class="fragment-grid">
        <div class="field"><label>风格强度</label><input name="strength" type="number" min="0" max="1" step="0.01" value="${esc(f.style_strength)}" /></div>
        <div class="field"><label>修复轮数</label><input name="iterations" type="number" min="0" max="10000" step="1" value="${esc(f.repair_iterations)}" /></div>
        <div class="field"><label>输出格式</label><select name="format">${['png','jpeg','json'].map(v => `<option value="${v}" ${f.output_format === v ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
        <div class="field"><label>掩码摘要</label><input value="${esc(f.mask.digest.slice(0, 18))}…" readonly /></div>
      </div>
      <div class="stage-list">${stageRows}</div>
      <div class="reason">${esc(reason)}</div>
      <div class="fragment-actions">
        <button onclick="updateFragment('${esc(id)}')">应用参数</button>
        <button onclick="convertFragment('${esc(id)}','png')">PNG</button>
        <button onclick="convertFragment('${esc(id)}','jpeg')">JPEG + JSON</button>
        <button onclick="convertFragment('${esc(id)}','json')">JSON</button>
      </div>
    </article>`;
  }).join('');
}
async function refresh() {
  const body = await api('/api/status');
  renderStatus(body.status);
}
(async function init() {
  try { const health = await api('/api/health'); document.getElementById('health').textContent = `v${health.version} · Python ${health.python}`; } catch (_) {}
  try { await refresh(); } catch (_) {}
})();
</script>
</body>
</html>
