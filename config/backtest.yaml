# Rolling backtest configuration for the local deterministic workbench.
# Candidate methods: moving_average | exponential_smoothing | linear_ar
method: moving_average
ar_lags: 3
es_alpha: 0.3
es_phi: 0.9

# Rolling fold geometry
window_length: 24
step: 6
horizon: 3

# Parallelism and hard budgets
max_workers: 2
global_fit_budget: 200
worker_fit_quota: 200
per_fit_time_budget_ms: 2000

# Data-quality rules
max_missing_ratio: 0.2
changepoint_threshold: 0.5

# Diagnostics
confidence_level: 0.95
version: v1
