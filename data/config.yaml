schema_version: 1
normalizer:
  max_subqueries: 8
  base_priority: 0
  rule_priority: 20
  clause_priority: 30
  synonym_priority: 40
  synonyms:
    并行:
    - 并发
    - parallel
    引用:
    - 引证
    - citation
    指纹:
    - fingerprint
    检查点:
    - 断点
    - checkpoint
    退款:
    - 退费
    - refund
  decomposition_rules:
  - id: parallel-budget
    triggers:
    - 并行
    - parallel
    - budget
    outputs:
    - 并行 检索 预算
    - parallel scheduling degradation
    priority: 20
  - id: fingerprint-invalidation
    triggers:
    - 版本指纹
    - fingerprint
    - invalidation
    outputs:
    - 版本指纹 增量失效
    - fingerprint invalidation 版本 失效
    priority: 20
  - id: refund-policy
    triggers:
    - 退款
    - refund
    outputs:
    - 退款 时限
    - refund timeline
    priority: 20
retrieval:
